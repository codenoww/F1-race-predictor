<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Podium Predictor</title>
<style>
  :root{
    --bg:#05070a; --panel:#0a0f14; --panel2:#0e1620; --line:#17323a; --line2:#1f4a55;
    --text:#cfe9ee; --muted:#6b8a93; --red:#ff2d3a; --gold:#ffc83d; --green:#2cff9a; --amber:#ffb020; --teal:#19e3ff;
    --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 var(--mono);padding:22px 14px 60px;
    background-image:linear-gradient(rgba(25,227,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(25,227,255,.035) 1px,transparent 1px);background-size:32px 32px}
  body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.18) 2px 3px);z-index:9}
  .wrap{max-width:940px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px;border-bottom:1px solid var(--line2);padding-bottom:12px}
  h1{margin:0;font-size:1.25rem;letter-spacing:3px;text-transform:uppercase;font-weight:700}
  h1 span{color:var(--red);text-shadow:0 0 10px rgba(255,45,58,.7)}
  .sub{color:var(--muted);font-size:.78rem;margin-top:3px}
  .cursor{display:inline-block;width:8px;height:14px;background:var(--teal);vertical-align:middle;margin-left:4px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pill{font-size:.72rem;color:var(--muted);border:1px solid var(--line2);padding:5px 10px;white-space:nowrap;background:var(--panel)}
  .pill b{color:var(--teal);font-weight:600}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);margin-right:7px;vertical-align:middle;animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .status{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.72rem;color:var(--muted);margin-bottom:16px;text-transform:uppercase;letter-spacing:1px}
  .status b{color:var(--green)}
  .card{background:var(--panel);border:1px solid var(--line);padding:16px 18px;margin-bottom:14px;position:relative}
  .card:before,.card:after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--teal)}
  .card:before{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .card:after{bottom:-1px;right:-1px;border-left:0;border-top:0}
  .card h2{margin:0 0 12px;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--teal);font-weight:600}
  .card h2:before{content:"> ";color:var(--muted)}
  .race-name{font-size:1.4rem;font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .chip{display:inline-block;font-size:.65rem;padding:1px 7px;border:1px solid var(--line2);color:var(--muted);margin-left:6px;vertical-align:middle;font-weight:400;letter-spacing:1px;text-transform:uppercase}
  .chip.live{color:var(--green);border-color:#17613f}
  .chip.warn{color:var(--amber);border-color:#6b4a10}
  .meta{color:var(--muted);margin-top:4px}
  .times{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:14px}
  .time{background:var(--panel2);border:1px solid var(--line);padding:10px 12px}
  .time small{display:block;color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:1.5px}
  .time b{display:block;margin-top:2px;font-weight:600}
  .time i{color:var(--teal);font-style:normal;font-size:1.05rem;letter-spacing:1px;text-shadow:0 0 8px rgba(25,227,255,.5)}
  .notice{margin-top:14px;padding:12px 14px;background:#140f05;border:1px solid #5a3f0c;color:#ffd78a;font-size:.82rem}
  .notice:before{content:"[WAIT] ";color:var(--amber);font-weight:700}
  .notice.fb{margin:14px 0 0}
  .notice.fb:before{content:""}
  .notice.fb b{color:var(--amber);letter-spacing:1px}
  .podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 14px}
  .step{text-align:left;background:var(--panel2);border:1px solid var(--line2);border-top:2px solid var(--muted);padding:12px 14px}
  .step.p1{border-top-color:var(--gold);box-shadow:0 0 18px rgba(255,200,61,.12)}
  .step.p2{border-top-color:#b8c7cc}.step.p3{border-top-color:#c9803d}
  .medal{font-size:.7rem;letter-spacing:2px;color:var(--muted)}
  .step.p1 .medal{color:var(--gold)}
  .drv{font-size:1.6rem;font-weight:800;margin-top:2px;letter-spacing:2px}
  .team{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .qtag{font-size:.7rem;color:var(--teal);margin-top:6px}
  .bar{height:3px;background:var(--line);margin-top:8px}
  .bar i{display:block;height:100%;background:var(--teal);box-shadow:0 0 6px var(--teal)}
  table{width:100%;border-collapse:collapse;font-size:.8rem}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;font-weight:600;border-bottom-color:var(--line2)}
  tbody tr:hover td{background:rgba(25,227,255,.05)}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.out td{color:#3d525a;text-decoration:line-through}
  tr.top td:first-child{color:var(--gold);font-weight:700}
  .up{color:var(--green)}.down{color:var(--red)}.same{color:var(--muted)}
  .scroll{overflow-x:auto}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--panel2);border:1px solid var(--line);padding:11px 12px}
  .tile small{color:var(--muted);font-size:.64rem;text-transform:uppercase;letter-spacing:1.4px}
  .tile .big{font-size:1.5rem;font-weight:700;margin:2px 0;color:var(--teal);text-shadow:0 0 10px rgba(25,227,255,.35)}
  .tile .vs{color:var(--muted);font-size:.72rem}
  .caption{color:var(--muted);font-size:.75rem;margin:0 0 10px}
  .cell{white-space:nowrap}
  .tag{display:inline-block;font-size:.7rem;font-weight:600;padding:0 6px;border:1px solid var(--line2);margin-right:3px;color:var(--muted)}
  .tag.hit{border-color:#17613f;background:rgba(44,255,154,.1);color:var(--green)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:680px){.two,.podium{grid-template-columns:1fr}.race-name{font-size:1.1rem}}
  .rc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
  select,input,button{background:var(--panel2);border:1px solid var(--line2);color:var(--text);padding:7px 10px;font:inherit;border-radius:0}
  input{flex:1;min-width:130px}
  button{cursor:pointer;text-transform:uppercase;letter-spacing:1px;font-size:.72rem}
  button:hover{border-color:var(--teal);color:var(--teal)}
  button.danger{border-color:#6a1d22;color:#ff7a82}
  .outlist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .outrow{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid #4a1a1e;padding:6px 10px;font-size:.8rem}
  .link{background:none;border:none;color:var(--teal);padding:0}
  details summary{cursor:pointer;color:var(--teal);font-size:.8rem;letter-spacing:1px;text-transform:uppercase}
  details p,details li{color:var(--muted);font-size:.8rem}
  .err{color:#ff7a82}
  .tyre{display:inline-block;border:1px solid;padding:0 5px;font-weight:700;font-size:.72rem}
  .pw{color:var(--amber);font-size:.68rem;letter-spacing:1px;border:1px solid #6b4a10;padding:0 5px;white-space:nowrap}
  .sw{display:inline-block;width:4px;height:12px;margin-right:7px;vertical-align:middle}
  .rcl{font-size:.74rem;color:var(--muted);padding:2px 0;border-bottom:1px dotted var(--line)}
  .rcl span{color:var(--teal);margin-right:6px}.rcl b{color:var(--amber)}
  footer{color:var(--muted);font-size:.7rem;text-align:center;margin-top:22px;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span>F1</span> // Podium Predictor</h1>
      <div class="sub">autonomous feed · nothing to click<span class="cursor"></span></div>
    </div>
    <div class="pill" id="updated">Loading…</div>
  </header>
  <div class="status" id="status"></div>
  <div id="live"></div>
  <div id="app"><div class="card">Loading the latest data…</div></div>
  <footer id="foot"></footer>
</div>

<script>
const DEFAULT_SRC = 'https://raw.githubusercontent.com/codenoww/F1-race-predictor/main/public/data/dashboard.json';
const SRC = new URLSearchParams(location.search).get('src') || DEFAULT_SRC;
const REFRESH_MS = 10 * 60 * 1000;

let D = null;
let outState = {list: []};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

function when(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleString(undefined, {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', timeZoneName:'short'});
}
function rel(iso){
  const ms = new Date(iso) - Date.now(), a = Math.abs(ms);
  const d = Math.floor(a / 864e5), h = Math.floor(a % 864e5 / 36e5), m = Math.floor(a % 36e5 / 6e4);
  const s = d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
  return ms >= 0 ? `in ${s}` : `${s} ago`;
}
function storageKey(){ return D && D.next_race ? `f1-out-${D.season}-${D.next_race.round}` : 'f1-out'; }
function loadOut(){ try{ return JSON.parse(localStorage.getItem(storageKey())) || []; }catch(e){ return []; } }
function saveOut(){ try{ localStorage.setItem(storageKey(), JSON.stringify(outState.list)); }catch(e){} }

function raceCard(){
  const n = D.next_race;
  if(!n) return `<div class="card"><h2>Next race</h2><div class="race-name">Season complete</div><div class="meta">The next season's calendar isn't published yet. This page will pick it up automatically.</div></div>`;
  const p = D.prediction;
  const chip = p ? (p.provisional ? '<span class="chip warn">fallback</span>' : p.live ? '<span class="chip live">frozen before the race</span>' : '<span class="chip warn">made after the race started</span>') : '';
  let body = '';
  const qDone = n.quali_start && new Date(n.quali_start) < Date.now();
  if(!p){
    body = `<div class="notice">${qDone
      ? 'Qualifying has finished. Waiting for the official results to be published (usually a few hours, sometimes up to a day).'
      : 'No prediction yet. The model needs the qualifying result, so it appears here automatically after qualifying.'}
      This page checks every hour, and you don't need to do anything.</div>`;
  } else {
    body = podiumBlock();
  }
  return `<div class="card">
    <h2>Next race</h2>
    <div class="race-name">${esc(n.name)}<span class="chip">Round ${n.round}</span>${n.sprint_weekend ? '<span class="chip">sprint weekend</span>' : ''}${chip}</div>
    <div class="meta">${esc(n.circuit)} · ${esc(n.locality)}, ${esc(n.country)}</div>
    <div class="times">
      <div class="time"><small>Qualifying</small><b>${when(n.quali_start)}</b><i data-t="${n.quali_start || ''}">${n.quali_start ? rel(n.quali_start) : ''}</i></div>
      <div class="time"><small>Race</small><b>${when(n.race_start)}</b><i data-t="${n.race_start}">${rel(n.race_start)}</i></div>
    </div>
    ${body}
  </div>`;
}

function podiumBlock(){
  const p = D.prediction;
  const out = new Set((outState.list || []).map(o => o.driver));
  const running = p.order.filter(o => !out.has(o.driver));
  const medals = ['P1 // WIN','P2','P3'];
  const top = running.slice(0,3).map((o,i) => `<div class="step p${i+1}"><div class="medal">${medals[i]}</div><div class="drv">${esc(o.driver)}</div><div class="team">${esc(o.team)}</div><div class="qtag">QUALI P${o.qpos}</div><div class="bar"><i style="width:${Math.max(8, 100 - (o.qpos-1)*7)}%"></i></div></div>`).join('');
  let pos = 0;
  const rows = p.order.slice(0,10).map(o => {
    const isOut = out.has(o.driver);
    if(!isOut) pos++;
    const d = o.qpos - pos;
    const mv = isOut ? '' : d > 0 ? `<span class="up">▲${d}</span>` : d < 0 ? `<span class="down">▼${-d}</span>` : '<span class="same">=</span>';
    return `<tr class="${isOut ? 'out' : (pos <= 3 ? 'top' : '')}"><td>${isOut ? '—' : 'P' + pos}</td><td>${esc(o.driver)}</td><td>${esc(o.team)}</td><td class="n">P${o.qpos}</td><td class="n">${mv}</td></tr>`;
  }).join('');
  const sel = running.map(o => `<option value="${esc(o.driver)}">${esc(o.driver)} · ${esc(o.team)}</option>`).join('');
  const list = (outState.list || []).map(o => `<div class="outrow"><span><span class="down">[OUT]</span> <b>${esc(o.driver)}</b> ${o.reason ? '· ' + esc(o.reason) : ''}</span><button class="link" data-undo="${esc(o.driver)}">undo</button></div>`).join('');
  const fb = p.provisional ? `<div class="notice fb"><b>FALLBACK:</b> qualifying lap times aren't published yet, so this is just the starting-grid order, not the model's prediction. It is replaced automatically, and the real prediction frozen, once the times arrive. It is not counted in the track record.</div>` : '';
  return `${fb}
    <div class="podium">${top}</div>
    <div class="scroll"><table>
      <thead><tr><th>Predicted</th><th>Driver</th><th>Team</th><th class="n">Qualified</th><th class="n">vs quali</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="caption" style="margin-top:10px">${p.provisional ? 'Provisional, checked ' + when(p.generated_at) + '. Grid order only.' : 'Frozen ' + when(p.generated_at) + '. Built from qualifying and recent form only. It mostly follows qualifying order; the track record below shows how that compares.'}</p>
    <div class="rc">
      <select id="outSel">${sel}</select>
      <input id="outWhy" placeholder="reason (optional)">
      <button class="danger" id="outBtn">Mark driver OUT</button>
    </div>
    <div class="outlist">${list}</div>`;
}

function chips(arr, actual){
  const a = new Set(actual || []);
  return arr.map(d => `<span class="tag ${a.has(d) ? 'hit' : ''}">${esc(d)}</span>`).join('');
}

function trackCard(){
  const t = D.track_record, s = t.summary_all;
  if(!s) return '';
  const live = t.summary_live;
  const tile = (title, m, b) => `<div class="tile"><small>${title}</small><div class="big">${m}</div><div class="vs">qualifying order alone: ${b}</div></div>`;
  const rows = t.rows.map(r => `<tr>
      <td>R${r.round}</td><td>${esc(r.name.replace(' Grand Prix',''))}</td>
      <td class="cell">${chips(r.pred_top3, r.actual_top3)}</td>
      <td class="cell">${chips(r.actual_top3, [])}</td>
      <td class="n">${r.winner_hit ? '✓' : '✗'}</td>
      <td class="n">${r.podium}/3</td><td class="n same">${r.base_podium}/3</td>
      <td>${r.type === 'live' ? '<span class="chip live">live</span>' : '<span class="chip">backtest</span>'}</td></tr>`).join('');
  return `<div class="card">
    <h2>Track record: how good is it, honestly?</h2>
    <div class="tiles">
      ${tile('Winner picked right', `${s.model_winners} of ${s.races}`, `${s.base_winners} of ${s.races}`)}
      ${tile('Podium drivers right (avg of 3)', s.model_podium_avg.toFixed(2), s.base_podium_avg.toFixed(2))}
      ${live ? `<div class="tile"><small>Live predictions only</small><div class="big">${live.model_winners} of ${live.races}</div><div class="vs">winner picked right (frozen before the race)</div></div>` : ''}
    </div>
    <p class="caption">"Backtest" rows re-run the same model as if the race hadn't happened (only earlier races plus that race's qualifying). "Live" rows are predictions frozen before the race. Green = the predicted driver finished on the podium. The last column is the score you'd get by just copying the qualifying order.</p>
    <div class="scroll" style="max-height:420px;overflow-y:auto"><table>
      <thead><tr><th>Rd</th><th>Race</th><th>Predicted top 3</th><th>Actual top 3</th><th class="n">Win</th><th class="n">Podium</th><th class="n">Quali order</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </div>`;
}

function pct(a, b){ return b ? Math.round(100 * a / b) + '%' : '—'; }

function circuitCard(){
  const c = D.circuit_history, ps = D.pole_stats;
  const tiles = [];
  if(c && c.pole_known){
    tiles.push(`<div class="tile"><small>Pole won here</small><div class="big">${c.pole_wins} of ${c.pole_known}</div><div class="vs">${pct(c.pole_wins, c.pole_known)} of editions since ${c.since}</div></div>`);
  }
  if(c && c.winner_grids_known){
    tiles.push(`<div class="tile"><small>Winner started top 3</small><div class="big">${c.winner_top3} of ${c.winner_grids_known}</div><div class="vs">average winning grid slot ${c.winner_avg_grid}, furthest back P${c.worst_winning_grid}</div></div>`);
  }
  if(ps && ps.current && ps.current.races){
    const p = ps.previous;
    tiles.push(`<div class="tile"><small>Pole won this season</small><div class="big">${ps.current.pole_wins} of ${ps.current.races}</div><div class="vs">${pct(ps.current.pole_wins, ps.current.races)}${p && p.races ? ` · last season ${p.pole_wins} of ${p.races} (${pct(p.pole_wins, p.races)})` : ''}</div></div>`);
  }
  if(!tiles.length && !(c && c.recent && c.recent.length)) return '';
  const fin = r => r.pole_finish === 1 ? '<span class="up">won</span>' : r.pole_finish ? 'P' + r.pole_finish : '—';
  const rows = c && c.recent ? c.recent.map(r => `<tr><td>${r.year}</td><td>${esc(r.pole || '—')}</td><td>${fin(r)}</td><td>${esc(r.winner || '—')}</td><td class="n">${r.winner_grid ? 'P' + r.winner_grid : '—'}</td></tr>`).join('') : '';
  const note = c && c.pole_known && c.pole_known < 5
    ? `<p class="caption">Only ${c.pole_known} modern edition${c.pole_known === 1 ? '' : 's'} at this circuit, so treat these numbers with caution.</p>`
    : (c && !c.editions_total ? '<p class="caption">First race at this circuit, so there is no history yet.</p>' : '');
  return `<div class="card">
    <h2>${c ? 'This circuit and pole position' : 'Pole position'}</h2>
    ${tiles.length ? `<div class="tiles">${tiles.join('')}</div>` : ''}
    ${note}
    ${rows ? `<p class="caption">Last editions at ${esc(c.circuit)}. "Pole" is whoever started from the front of the grid.</p>
    <div class="scroll"><table>
      <thead><tr><th>Year</th><th>Pole-sitter</th><th>Result</th><th>Winner</th><th class="n">Winner's grid</th></tr></thead>
      <tbody>${rows}</tbody></table></div>` : ''}
  </div>`;
}

function standingsCard(){
  const s = D.standings;
  if(!s || !s.drivers || !s.drivers.length) return '';
  const dr = s.drivers.slice(0,10).map(x => `<tr><td>${x.pos}</td><td>${esc(x.driver)}</td><td>${esc(x.team)}</td><td class="n">${x.points}</td><td class="n">${x.wins}</td></tr>`).join('');
  const co = s.constructors.map(x => `<tr><td>${x.pos}</td><td>${esc(x.team)}</td><td class="n">${x.points}</td><td class="n">${x.wins}</td></tr>`).join('');
  return `<div class="card"><h2>Championship standings${s.after_round ? ' · after round ' + s.after_round : ''}</h2>
    <div class="two">
      <div class="scroll"><table><thead><tr><th>#</th><th>Driver</th><th>Team</th><th class="n">Pts</th><th class="n">Wins</th></tr></thead><tbody>${dr}</tbody></table></div>
      <div class="scroll"><table><thead><tr><th>#</th><th>Team</th><th class="n">Pts</th><th class="n">Wins</th></tr></thead><tbody>${co}</tbody></table></div>
    </div></div>`;
}

function howCard(){
  const m = D.model;
  const w = m ? Object.entries(m.weights).map(([k,v]) => `<li>${esc(k)}: <b>${v}</b></li>`).join('') : '';
  return `<div class="card"><details><summary>How it works</summary>
    <p><b>What it uses:</b> only that weekend's <i>qualifying</i> result (each driver's gap to pole, gap to their teammate, grid position) plus how each driver finished in their last 3 races. It never looks at practice or at the race it is predicting. On sprint weekends the sprint result is allowed but not used yet.</p>
    <p><b>The model:</b> a weighted ridge regression, which is a linear model. It adds up the clues, each multiplied by a number learned from past races (this season's races count 3×, and the "ridge" part stops it overreacting to noise). It is trained on ${m ? m.training_races + ' races (' + m.training_rows + ' driver results)' : 'all completed races'} of this and last season.</p>
    ${m ? `<p>What it currently learned (higher = pushes a driver toward a worse finish):</p><ul>${w}</ul>` : ''}
    <p><b>Updating:</b> a job on GitHub's servers checks the public results database every hour and rebuilds this page's data. Predictions freeze the first time they're made, so the track record can't be quietly rewritten.</p>
    <p><b>Data:</b> ${esc(D.sources)}.</p></details></div>`;
}

function render(){
  if(!D) return;
  outState.list = loadOut();
  $('app').innerHTML = raceCard() + circuitCard() + trackCard() + standingsCard() + howCard();
  $('updated').innerHTML = `<span class="dot"></span>Data changed <b>${rel(D.generated_at)}</b> · checked hourly`;
  $('foot').textContent = `Season ${D.season} // data: jolpi + openf1`;
  const n = D.next_race;
  $('status').innerHTML = `<span>SYS <b>ONLINE</b></span><span>SYNC <b>${new Date(D.generated_at).toISOString().slice(11,16)}Z</b></span>` +
    (n ? `<span>ROUND <b>${n.round}</b></span><span>MODE <b>${D.prediction ? (D.prediction.provisional ? 'FALLBACK (GRID ORDER)' : 'PREDICTION LOCKED') : 'AWAITING QUALI'}</b></span>` : '<span>MODE <b>OFF-SEASON</b></span>');
  const btn = $('outBtn');
  if(btn){
    btn.onclick = () => {
      const d = $('outSel').value; if(!d) return;
      if(!outState.list.some(o => o.driver === d)) outState.list.push({driver:d, reason:$('outWhy').value.trim()});
      saveOut(); render();
    };
    document.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => {
      outState.list = outState.list.filter(o => o.driver !== b.dataset.undo); saveOut(); render();
    });
  }
}

async function load(){
  try{
    const r = await fetch(SRC + (SRC.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
    render();
  }catch(e){
    if(!D) $('app').innerHTML = `<div class="card err">Couldn't load the data (${esc(e.message)}). Try again in a minute.</div>`;
  }
}
function cd(iso){
  const ms = new Date(iso) - Date.now(), a = Math.abs(ms), p = x => String(x).padStart(2,'0');
  const d = Math.floor(a/864e5), h = Math.floor(a%864e5/36e5), m = Math.floor(a%36e5/6e4), sc = Math.floor(a%6e4/1e3);
  return (ms >= 0 ? 'T-' : 'T+') + (d ? d + 'd ' : '') + p(h) + ':' + p(m) + ':' + p(sc);
}
setInterval(() => document.querySelectorAll('[data-t]').forEach(e => { if(e.dataset.t) e.textContent = cd(e.dataset.t); }), 1000);
load();
setInterval(load, REFRESH_MS);

/* ===================== LIVE TIMING PANEL (OpenF1, browser -> API directly) =====================
   Shows nothing but a quiet status line unless a session is on. Never touches the frozen prediction.
   Debug/replay a past session:  ?replay=<session_key>&at=2026-11-08T18:00:00   (clock starts at that UTC time) */
const OF1 = 'https://api.openf1.org/v1';
const QP = new URLSearchParams(location.search);
const REPLAY = QP.get('replay'), REPLAY_AT = QP.get('at');
const REPLAY_OFF = REPLAY && REPLAY_AT ? Date.parse(REPLAY_AT + 'Z') - Date.now() : 0;
const clock = () => new Date(Date.now() + REPLAY_OFF);
const naive = d => d.toISOString().slice(0, 19);
const TYRE = {SOFT:['S','#ff4d4d',18], MEDIUM:['M','#ffd24a',26], HARD:['H','#e8f4f6',34], INTERMEDIATE:['I','#2cff9a',22], WET:['W','#19a8ff',20]};
let L = null;
const lnew = sk => ({sk, dr:{}, pos:{}, lastPos:null, gap:{}, stints:{}, pit:{}, lap:{}, best:{}, wx:null, rc:[], lastRc:null, ok:null, err:null, ready:false});

async function of(path){
  try{
    const r = await fetch(OF1 + path);
    if(r.status === 404) return {s:404, d:[]};
    if(!r.ok) return {s:r.status, d:null};
    return {s:200, d:await r.json()};
  }catch(e){ return {s:0, d:null}; }
}
const upTo = () => REPLAY ? `&date<=${naive(clock())}` : '';

let sessions = [], cur = null, nxt = null, sessErr = null, lastSessFetch = 0;
async function pickSession(){
  if(Date.now() - lastSessFetch > 10 * 60e3 || !sessions.length){
    lastSessFetch = Date.now();
    const r = await of(REPLAY ? `/sessions?session_key=${REPLAY}` : `/sessions?year=${clock().getUTCFullYear()}`);
    if(r.d) { sessions = r.d; sessErr = null; } else sessErr = r.s;
  }
  const t = clock().getTime();
  cur = sessions.find(s => t >= Date.parse(s.date_start) - 10 * 60e3 && t <= Date.parse(s.date_end) + 20 * 60e3) || null;
  nxt = sessions.filter(s => Date.parse(s.date_start) > t).sort((a, b) => Date.parse(a.date_start) - Date.parse(b.date_start))[0] || null;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function initSession(){
  const k = cur.session_key;
  const nl = lnew(k);
  const steps = [
    [`/drivers?session_key=${k}`, r => (r || []).forEach(d => nl.dr[d.driver_number] = {code:d.name_acronym, team:d.team_name, col:'#' + (d.team_colour || '888888')})],
    [`/laps?session_key=${k}${REPLAY ? `&date_start<=${naive(clock())}` : ''}`, r => { L = nl; ingestLaps(r || []); }],
    [`/race_control?session_key=${k}${upTo()}`, r => { L = nl; ingestRc(r || []); }],
    [`/position?session_key=${k}${upTo()}`, r => { L = nl; ingestPos(r || []); }],
  ];
  L = nl;
  for(const [path, fn] of steps){
    let res = await of(path);
    if(res.d === null){ await sleep(20e3); res = await of(path); }   // one patient retry (rate limit)
    if(res.d === null){ L = null; return; }
    fn(res.d);
    await sleep(1500);
  }
  L.ready = true;
}
function ingestPos(rows){ rows.forEach(r => { L.pos[r.driver_number] = r.position; if(!L.lastPos || r.date > L.lastPos) L.lastPos = r.date; }); }
function ingestLaps(rows){
  rows.forEach(r => {
    const n = r.driver_number;
    if(r.lap_number && (!L.lap[n] || r.lap_number > L.lap[n])) L.lap[n] = r.lap_number;
    if(r.lap_duration && !r.is_pit_out_lap && (!L.best[n] || r.lap_duration < L.best[n])) L.best[n] = r.lap_duration;
  });
}
function ingestRc(rows){
  rows.forEach(r => { if(!L.lastRc || r.date > L.lastRc) L.lastRc = r.date; });
  L.rc = L.rc.concat(rows).slice(-60);
}

/* OpenF1's free tier allows about 30 requests a minute, so we send ONE request every 3 s and rotate through the data types. */
const EPS = ['pos', 'int', 'laps', 'stints', 'pit', 'wx', 'rc'];
let rr = 0, backoffUntil = 0;
async function pollOne(){
  if(Date.now() < backoffUntil) return;
  const k = cur.session_key, t = clock(), win = naive(new Date(t - 90e3)), win3 = naive(new Date(t - 5 * 60e3));
  const ep = EPS[rr++ % EPS.length];
  const path = {
    pos: `/position?session_key=${k}&date>${(L.lastPos || '').slice(0, 19) || win3}${upTo()}`,
    int: `/intervals?session_key=${k}&date>=${win}${upTo()}`,
    laps: `/laps?session_key=${k}&date_start>=${win3}${REPLAY ? `&date_start<=${naive(t)}` : ''}`,
    stints: `/stints?session_key=${k}`,
    pit: `/pit?session_key=${k}${upTo()}`,
    wx: `/weather?session_key=${k}&date>=${win3}${upTo()}`,
    rc: `/race_control?session_key=${k}&date>${(L.lastRc || naive(new Date(t - 60e3))).slice(0, 19)}${upTo()}`,
  }[ep];
  const r = await of(path);
  if(r.d === null){
    L.err = r.s;
    if(r.s === 429 || r.s === 0) backoffUntil = Date.now() + 25e3;
    return;
  }
  L.err = null; L.ok = Date.now();
  const d = r.d;
  if(ep === 'pos') ingestPos(d);
  else if(ep === 'laps') ingestLaps(d);
  else if(ep === 'rc') ingestRc(d);
  else if(ep === 'int') d.forEach(x => L.gap[x.driver_number] = {gap:x.gap_to_leader, int:x.interval});
  else if(ep === 'stints'){ L.stints = {}; d.forEach(s => (L.stints[s.driver_number] = L.stints[s.driver_number] || []).push(s)); }
  else if(ep === 'pit'){ L.pit = {}; d.forEach(p => { const e = L.pit[p.driver_number] || (L.pit[p.driver_number] = {n:0}); e.n++; }); }
  else if(ep === 'wx' && d.length) L.wx = d[d.length - 1];
}

const fmtGap = g => g == null ? '—' : g === 0 ? 'LEADER' : typeof g === 'number' ? '+' + g.toFixed(3) : String(g);
const fmtLap = s => { if(!s) return '—'; const m = Math.floor(s / 60); return m + ':' + (s - 60 * m).toFixed(3).padStart(6, '0'); };

function liveHtml(){
  const chip = REPLAY ? '<span class="chip warn">replay</span>' : '<span class="chip live">live</span>';
  const head = `<h2>Live timing · ${esc(cur.session_name)} · ${esc(cur.circuit_short_name || cur.location || '')} ${chip}</h2>`;
  if(!L || !L.ready) return `<div class="card">${head}<div class="meta">connecting to OpenF1…</div></div>`;
  if(L.err && !L.ok) return `<div class="card">${head}<div class="notice fb"><b>OPENF1 ERROR HTTP ${L.err || 'network'}:</b> live data isn't reachable right now${[401, 403, 429].includes(L.err) ? ' (OpenF1 may be restricting live access)' : ''}. Retrying every few seconds. Saved results and the prediction below are unaffected.</div></div>`;
  const raceLike = /^(Race|Sprint)$/.test(cur.session_name);
  const nums = Object.keys(L.dr);
  let order;
  if(raceLike) order = nums.filter(n => L.pos[n]).sort((a, b) => L.pos[a] - L.pos[b]);
  else order = nums.filter(n => L.best[n]).sort((a, b) => L.best[a] - L.best[b]);
  const lead = order.length ? L.best[order[0]] : null;
  const maxLap = Math.max(0, ...Object.values(L.lap));
  const ago = L.ok ? Math.round((Date.now() - L.ok) / 1000) : null;
  let podiumNow = '', pits = '';
  const rows = order.map((n, i) => {
    const d = L.dr[n], pit = L.pit[n];
    const lap = L.lap[n] || maxLap;
    const st = ((L.stints || {})[n] || []).filter(x => x.lap_start <= lap).sort((a, b) => b.lap_start - a.lap_start)[0];
    let tyre = '—', flag = '';
    if(st && st.lap_start <= lap){
      const T = TYRE[(st.compound || '').toUpperCase()] || ['?', '#9ab', 25];
      const age = (st.tyre_age_at_start || 0) + Math.max(0, lap - st.lap_start);
      tyre = `<span class="tyre" style="color:${T[1]};border-color:${T[1]}">${T[0]}</span> ${age}L`;
      if(raceLike && age >= 0.8 * T[2]){ const left = Math.max(0, Math.round(T[2] - age)); flag = ` <span class="pw">PIT WINDOW ~${left}L</span>`; }
    }
    const g = L.gap[n];
    const gapCell = raceLike ? fmtGap(g && g.gap) : (i ? '+' + (L.best[n] - lead).toFixed(3) : fmtLap(lead));
    const intCell = raceLike ? fmtGap(g && g.int) : fmtLap(L.best[n]);
    return `<tr><td>${i + 1}</td><td><span class="sw" style="background:${d.col}"></span>${esc(d.code)}</td><td>${esc(d.team)}</td><td class="n">${gapCell}</td><td class="n">${intCell}</td><td class="cell">${tyre}${flag}</td><td class="n">${pit ? pit.n : 0}</td></tr>`;
  }).join('');
  if(raceLike && D && D.prediction && !D.prediction.provisional){
    const now3 = order.slice(0, 3).map(n => L.dr[n].code), pre = D.prediction.order.slice(0, 3).map(o => o.driver);
    podiumNow = `<div class="tiles" style="margin-top:12px"><div class="tile"><small>Pre-race pick (frozen)</small><div class="big">${pre.map(d => `<span class="tag ${now3.includes(d) ? 'hit' : ''}">${esc(d)}</span>`).join('')}</div></div>
      <div class="tile"><small>Running top 3 right now</small><div class="big">${now3.map(d => esc(d)).join(' · ')}</div><div class="vs">green = pre-race pick currently on the podium</div></div></div>`;
  }
  const w = L.wx ? `<span>AIR <b>${L.wx.air_temperature}°</b></span><span>TRACK <b>${L.wx.track_temperature}°</b></span><span>RAIN <b>${L.wx.rainfall ? 'YES' : 'NO'}</b></span><span>WIND <b>${L.wx.wind_speed} m/s</b></span><span>HUM <b>${L.wx.humidity}%</b></span>` : '';
  const rc = L.rc.slice(-5).reverse().map(r => `<div class="rcl"><span>${esc((r.date || '').slice(11, 19))}</span> ${r.flag ? `<b>${esc(r.flag)}</b> ` : ''}${esc(r.message || '')}</div>`).join('');
  return `<div class="card">${head}
    <div class="status" style="margin-bottom:10px"><span>LAP <b>${maxLap || '—'}</b></span>${w}<span>UPDATED <b>${ago == null ? '—' : ago + 's ago'}</b></span>${L.err ? `<span class="down">LINK ISSUE HTTP ${L.err || 'net'} · showing last data, retrying</span>` : ''}</div>
    <div class="scroll"><table><thead><tr><th>Pos</th><th>Driver</th><th>Team</th><th class="n">${raceLike ? 'Gap to leader' : 'Gap to best'}</th><th class="n">${raceLike ? 'Interval' : 'Best lap'}</th><th>Tyre</th><th class="n">Pits</th></tr></thead><tbody>${rows || '<tr><td colspan="7" class="same">waiting for the first timing data…</td></tr>'}</tbody></table></div>
    ${podiumNow}
    ${rc ? `<p class="caption" style="margin:12px 0 6px">RACE CONTROL</p>${rc}` : ''}
    <p class="caption" style="margin-top:10px">Straight from OpenF1 to your browser while this page is open. Each data type refreshes about every 20 s because OpenF1's free tier limits request rates. "Pit window" is a rule of thumb (tyre age vs a typical stint length), not a prediction from team radio. The frozen pre-race prediction is never changed by this panel.</p>
  </div>`;
}
function idleHtml(){
  const n = nxt ? `${esc(nxt.session_name)} · ${esc(nxt.circuit_short_name || '')} <i data-t="${nxt.date_start}" style="color:var(--teal);font-style:normal">${cd(nxt.date_start)}</i>` : 'none scheduled';
  const e = sessErr ? ` <span class="down">(OpenF1 unreachable: HTTP ${sessErr || 'network'})</span>` : '';
  return `<div class="status"><span>LIVE TIMING <b style="color:var(--muted)">STANDBY</b></span><span>NEXT SESSION <b style="color:var(--teal)">${n}</b></span>${e}</div>`;
}

async function liveTick(){
  let delay = 30e3;
  try{
    await pickSession();
    const box = document.getElementById('live');
    if(cur){
      if(!L || L.sk !== cur.session_key) await initSession();
      if(L){ await pollOne(); delay = 3e3; }
      box.innerHTML = liveHtml();
    } else {
      L = null;
      box.innerHTML = idleHtml();
    }
  }catch(e){ console.warn('live panel', e); }
  setTimeout(liveTick, delay);
}
setTimeout(liveTick, 1500);

</script>
</body>
</html>

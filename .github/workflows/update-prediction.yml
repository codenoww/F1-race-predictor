name: Update F1 prediction

on:
  # Manual only. GitHub-hosted runners cannot reach F1's live-timing archive, so a
  # scheduled run there can never produce a full prediction (see generate_site.py).
  # This workflow is meant for a self-hosted runner on a machine that can.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute cache key
        id: cachekey
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # GitHub cache entries are immutable per key, so a fixed key freezes the
      # cache forever. A dated key + restore-keys restores the newest cache and
      # saves an updated one at most once per day. FastF1 caps itself at 500
      # API calls/hour, and a cold cache burns that budget on history alone.
      - name: Restore FastF1 cache
        uses: actions/cache/restore@v4
        with:
          path: f1_cache
          key: fastf1-cache-${{ steps.cachekey.outputs.day }}
          restore-keys: |
            fastf1-cache-

      - name: Install dependencies
        run: pip install -r webapp/requirements.txt

      - name: Generate prediction site
        working-directory: webapp
        run: python generate_site.py

      - name: Save FastF1 cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: f1_cache
          key: fastf1-cache-${{ steps.cachekey.outputs.day }}

      - name: Commit and push if changed
        run: |
          git config user.name "f1-predictor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Auto-update prediction ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin main
          git push

name: Update dashboard

on:
  schedule:
    # Hourly (GitHub may delay scheduled runs a few minutes). Uses only the public results
    # database, which GitHub's servers can reach, so no PC needs to be on.
    - cron: "17 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "dashboard/**"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Build dashboard data
        run: python dashboard/build.py

      - name: Commit if changed
        run: |
          git config user.name "f1-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data public/data
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Update dashboard data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin main
          git push
